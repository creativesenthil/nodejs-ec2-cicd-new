name: Node.js CI/CD Pipeline on EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      run: |
        node -v
        npm -v

    - name: Install Dependencies
      run: npm install

    - name: Run Automated Tests
      run: npm test

    - name: Deploy Application with PM2
      run: |
        mkdir -p /home/ec2-user/nodejs-app
        cp -r * /home/ec2-user/nodejs-app/
        cd /home/ec2-user/nodejs-app
        pm2 restart "nodejs-poc-app" || pm2 start app.js --name "nodejs-poc-app"
        pm2 save
        curl -s http://localhost:3000
